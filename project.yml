name: AIR_SYNTH
options:
  bundleIdPrefix: com.snarfnet
  deploymentTarget:
    iOS: "16.0"
targets:
  AIR_SYNTH:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
      - path: Assets.xcassets
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AIR SYNTH
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snarfnet.airsynth
        DEVELOPMENT_TEAM: 83VGKGSQUH
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        TARGETED_DEVICE_FAMILY: 1
