name: AIR_SYNTH
options:
  bundleIdPrefix: com.snarfnet
  deploymentTarget:
    iOS: "16.0"
targets:
  AIR_SYNTH:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
      - path: Assets.xcassets
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AIR SYNTH
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "Record your voice and turn it into a synth sound."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snarfnet.airsynth
        DEVELOPMENT_TEAM: 83VGKGSQUH
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        TARGETED_DEVICE_FAMILY: 1
